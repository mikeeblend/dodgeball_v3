<style>
:root{
  --bg:#0C0C0E; --card:#17171B; --card-2:#1F1F25; --line:#2A2A32;
  --pink:#FF2E7E; --pink-deep:#C9005E; --white:#FFFFFF; --muted:#9A9AA4;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--white);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.4;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
select,input{font:inherit}
.screen{display:none;max-width:560px;margin:0 auto;padding:0 16px 48px}
.screen.active{display:block}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:10;background:var(--bg);
  display:flex;align-items:center;gap:10px;
  padding:14px 0 12px;border-bottom:2px solid var(--pink);margin-bottom:16px;
}
header .back{
  width:48px;height:48px;flex:0 0 48px;border-radius:12px;background:var(--card);
  font-size:22px;display:flex;align-items:center;justify-content:center;color:var(--pink);
}
h1.app-title{font-size:26px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}
h1.app-title .dot{color:var(--pink)}
header .ttl{
  font-size:19px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;
}
header .sub{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.08em;text-transform:uppercase}

/* ---------- buttons ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;width:100%;
  min-height:56px;border-radius:var(--radius);
  font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.05em;
}
.btn-pink{background:var(--pink);color:var(--white)}
.btn-pink:active{background:var(--pink-deep)}
.btn-ghost{background:var(--card);border:1px solid var(--line)}
.btn-ghost:active{background:var(--card-2)}
.btn-sm{min-height:46px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.4;pointer-events:none}

/* ---------- home ---------- */
.hero{
  margin:8px 0 24px;padding:24px 18px;border-radius:20px;
  background:var(--pink);color:var(--white);
  display:flex;align-items:center;gap:14px;
}
.hero .hero-txt{flex:1;min-width:0}
.hero .hero-logo{width:42%;max-width:190px;height:auto;flex:0 0 auto}
.hero h2{font-size:30px;font-weight:900;text-transform:uppercase;letter-spacing:.03em;line-height:1.05}
.hero p{margin-top:8px;font-weight:600;opacity:.92}
.section-label{
  font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin:24px 0 10px;
}
.saved-item{
  width:100%;display:flex;align-items:center;gap:12px;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;min-height:64px;margin-bottom:10px;
}
.saved-item .nm{font-weight:800;font-size:16px}
.saved-item .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.saved-item .grow{flex:1;min-width:0}
.saved-item .del{
  width:44px;height:44px;flex:0 0 44px;border-radius:10px;background:var(--card-2);
  color:var(--muted);font-size:18px;display:flex;align-items:center;justify-content:center;
}
.empty{color:var(--muted);font-size:15px;padding:8px 2px}

/* ---------- setup ---------- */
.field{margin-bottom:20px}
.field label{display:block;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.input{
  width:100%;min-height:54px;padding:0 16px;border-radius:14px;
  background:var(--card);border:1px solid var(--line);color:var(--white);font-size:17px;
}
.input:focus{outline:none;border-color:var(--pink)}
.seg{display:flex;gap:8px}
.seg button{
  flex:1;min-height:52px;border-radius:14px;background:var(--card);border:1px solid var(--line);
  font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);
  padding:4px 6px;
}
.seg button.on{background:var(--pink);border-color:var(--pink);color:var(--white)}
.team-row{
  display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:8px 8px 8px 16px;margin-bottom:8px;min-height:54px;
}
.team-row .num{font-weight:900;color:var(--pink);width:24px;flex:0 0 24px;font-size:14px}
.team-row .nm{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team-row .rm{width:40px;height:40px;flex:0 0 40px;border-radius:10px;background:var(--card-2);color:var(--muted);font-size:16px}
.add-row{display:flex;gap:8px;margin-bottom:8px}
.add-row .input{flex:1}
.add-row .go{flex:0 0 56px;min-height:54px;border-radius:14px;background:var(--pink);font-size:26px;font-weight:900;color:#fff}
.hint{font-size:13px;color:var(--muted);margin-top:6px}

/* ---------- colour dots + chips ---------- */
.dot{
  display:inline-block;width:12px;height:12px;border-radius:50%;
  margin-right:7px;vertical-align:-1px;flex:0 0 auto;
}
.dot.black{background:#000;border:1.5px solid #6A6A75}
.dot.silver{background:linear-gradient(135deg,#F2F2F6,#8E8E99)}
.dot.rainbow{background:conic-gradient(#E63946,#FF8C00,#FFD60A,#2ECC40,#2E86FF,#9B30FF,#E63946)}
.colour-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-bottom:12px}
.chip{
  display:flex;align-items:center;gap:7px;min-height:52px;padding:0 10px;
  border-radius:12px;background:var(--card);border:1px solid var(--line);
  font-weight:800;font-size:13.5px;color:var(--white);
}
.chip .dot{width:16px;height:16px;margin:0}
.chip.on{border-color:var(--pink);background:var(--card-2)}
.chip .ck{margin-left:auto;color:var(--pink);font-weight:900;display:none}
.chip.on .ck{display:inline}

/* ---------- tournament tabs ---------- */
.tabs{display:flex;gap:8px;margin-bottom:16px;position:sticky;top:78px;z-index:9;background:var(--bg);padding:4px 0 8px}
.tabs button{
  flex:1;min-height:50px;border-radius:14px;background:var(--card);border:1px solid var(--line);
  font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
  padding:4px 4px;
}
.tabs button.on{background:var(--white);color:var(--bg);border-color:var(--white)}

/* ---------- schedule ---------- */
.cycle-h{
  display:flex;align-items:center;gap:10px;margin:6px 0 14px;color:var(--pink);
  font-size:13px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;
}
.cycle-h::before,.cycle-h::after{content:"";flex:1;height:2px;background:var(--pink);opacity:.4;border-radius:2px}
.round{margin-bottom:22px}
.round-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.round-h .rn{font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}
.badge{
  font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;
  padding:5px 10px;border-radius:999px;background:var(--card-2);color:var(--muted);border:1px solid var(--line);
}
.badge.done{background:var(--pink);color:#fff;border-color:var(--pink)}
.game{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin-bottom:10px;position:relative;
}
.game.done{border-color:var(--pink)}
.game .tick{
  position:absolute;top:-9px;right:12px;width:22px;height:22px;border-radius:50%;
  background:var(--pink);color:#fff;font-size:13px;font-weight:900;
  display:none;align-items:center;justify-content:center;
}
.game.done .tick{display:flex}
.vsrow{display:grid;grid-template-columns:1fr 78px;gap:10px;align-items:center}
.vsrow + .vsrow{margin-top:10px}
.vsrow .tn{font-weight:800;font-size:16.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vsrow .tn.win{color:var(--pink)}
.vsrow .seed{color:var(--muted);font-weight:900;font-size:12px;margin-right:4px}
.score-sel{
  width:78px;height:52px;border-radius:12px;border:1px solid var(--line);
  background:var(--card-2);color:var(--white);font-size:22px;font-weight:900;text-align:center;
  appearance:none;-webkit-appearance:none;
}
.score-sel:focus{outline:none;border-color:var(--pink)}
.game.done .score-sel{border-color:var(--pink)}
.bye{
  background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:10px;color:var(--muted);font-weight:700;font-size:14px;
}
.bye b{color:var(--white)}

/* ---------- bracket ---------- */
.bracket-wrap{overflow-x:auto;padding-bottom:12px;-webkit-overflow-scrolling:touch}
.bracket{display:flex;gap:16px;min-width:max-content}
.bcol{width:400px;display:flex;flex-direction:column;justify-content:space-around;gap:14px}
.bcol-h{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:2px}
.bcol .game{margin-bottom:0}
.tbd{color:var(--muted);font-style:italic;font-weight:600}
.champ{
  margin-top:18px;padding:18px;border-radius:18px;background:var(--pink);
  text-align:center;font-weight:900;font-size:18px;text-transform:uppercase;letter-spacing:.04em;
}
.champ small{display:block;font-size:11px;letter-spacing:.16em;opacity:.85;margin-bottom:4px}
.playoff-intro{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;margin-bottom:14px;
}
.playoff-intro h3{font-size:17px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.playoff-intro p{font-size:14px;color:var(--muted)}
.locknote{font-size:12.5px;color:var(--muted);margin:10px 2px 16px}

/* ---------- standings ---------- */
table.standings{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
.standings th{
  font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  padding:10px 6px;border-bottom:1px solid var(--line);text-align:center;background:var(--card-2);
}
.standings th.tl,.standings td.tl{text-align:left;padding-left:12px}
.standings td{padding:12px 6px;font-size:15px;text-align:center;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.standings tr:last-child td{border-bottom:none}
.standings td.tl{font-weight:800;max-width:0;width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.standings .pos{font-weight:900;color:var(--pink)}
.standings tr.lead td{background:rgba(255,46,126,.08)}
.standings th.win-col{color:var(--pink)}
.standings td.win-col{color:var(--white);font-weight:900;font-size:17px}
.standings th.det,.standings td.det{display:none}
.standings.details th.det,.standings.details td.det{display:table-cell}
.det-toggle{margin-bottom:10px}
.tiebreak-note{font-size:12.5px;color:var(--muted);margin-top:10px}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
  background:var(--white);color:var(--bg);font-weight:800;font-size:14px;
  padding:12px 20px;border-radius:999px;opacity:0;pointer-events:none;
  transition:all .25s;z-index:99;max-width:88vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<!-- ============ SETUP ============ -->
<div class="screen" id="scr-setup">
  <header>
    <button class="back" onclick="show('scr-home');renderHome()">‹</button>
    <div class="ttl">New tournament</div>
  </header>

  <div class="field">
    <label for="t-name">Tournament name</label>
    <input class="input" id="t-name" placeholder="Friday Night Dodgeball" maxlength="40">
  </div>

  <div class="field">
    <label>Format</label>
    <div class="seg" id="fmt-seg">
      <button data-f="rr" class="on" onclick="setFmt('rr')">Round robin</button>
      <button data-f="se" onclick="setFmt('se')">Single elim</button>
    </div>
    <div class="hint" id="fmt-hint"></div>
  </div>

  <div class="field">
    <label>Teams (<span id="team-count">0</span>)</label>
    <div class="add-row">
      <input class="input" id="team-name" placeholder="Team name" maxlength="24" onkeydown="if(event.key==='Enter')addTeam()">
      <button class="go" onclick="addTeam()" aria-label="Add team">+</button>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="addRandomTeam()" style="margin-bottom:8px">🎲 Add a random team name</button>
    <button class="btn btn-ghost btn-sm" id="colour-toggle" onclick="toggleColours()" style="margin-bottom:8px">🎨 Colour teams <span id="colour-arrow">▾</span></button>
    <div class="colour-grid" id="colour-grid" style="display:none"></div>
    <div id="team-list"></div>
  </div>

  <button class="btn btn-pink" id="create-btn" onclick="createTournament()">Start tournament</button>
</div>

<!-- ============ TOURNAMENT ============ -->
<div class="screen" id="scr-tourn">
  <header>
    <button class="back" onclick="show('scr-home');renderHome()">‹</button>
    <div style="flex:1;min-width:0">
      <div class="ttl" id="tn-title"></div>
      <div class="sub" id="tn-sub"></div>
    </div>
  </header>
  <div class="tabs">
    <button id="tab-sched" class="on" onclick="setTab('sched')">Schedule</button>
    <button id="tab-stand" onclick="setTab('stand')">Standings</button>
    <button id="tab-po" onclick="setTab('po')" style="display:none">Playoffs</button>
  </div>
  <div id="view-sched"></div>
  <div id="view-stand" style="display:none"></div>
  <div id="view-po" style="display:none"></div>
</div>

<div id="toast"></div>

<script>
"use strict";
/* =================================================================
   Dodgeball Scores — offline-first tournament manager
   Storage: localStorage.
   Formats: round robin (extendable cycles + playoff bracket), single elim.
   ================================================================= */

const MAX_SCORE = 9;
const LS_KEY = "db_tournaments_v1";
const LS_ACTIVE = "db_active_v1";

const FUN_NAMES = [
  "Ball Busters","Dodgefathers","The Untouchaballs","Pink Slips","Duck Hunters",
  "Throw-bots","Cannonballers","The Matrix Dodgers","Average Joes","Purple Cobras",
  "Hit Squad","Rubber Duckies","The Sidesteppers","Ballistic Missiles","Grip & Rip",
  "The Dodgy Bunch","Catch-22","Whiplash","Flying Pigs","Sting Like Bees",
  "The Headhunters","Dodge Chargers","No Mercy","Snipers Anonymous","The Wallflowers",
  "Velocity Vipers","Thunder Throwers","The Last Stand","Pivot Kings","Chaos Crew",
  "Rapid Fire","Spin Doctors","The Deflectors","Boom Squad","Net Gains"
];

const FMT_NAMES = { rr:"Round Robin", se:"Single Elimination" };

/* ---------- team colours ---------- */
const COLOUR_NAMES=["Pink","Purple","Green","Yellow","Blue","Orange","Red","Black","Silver","Rainbow"];
const COLOUR_HEX={pink:"#FF2E7E",purple:"#9B30FF",green:"#2ECC40",yellow:"#FFD60A",blue:"#2E86FF",orange:"#FF8C00",red:"#E63946"};
// dot for any team whose name is one of the 10 colours (case-insensitive)
function dotHTML(name){
  const k=String(name).trim().toLowerCase();
  if(COLOUR_HEX[k]) return `<span class="dot" style="background:${COLOUR_HEX[k]}"></span>`;
  if(k==="black"||k==="silver"||k==="rainbow") return `<span class="dot ${k}"></span>`;
  return "";
}
function teamLabel(t,id){ const n=teamName(t,id); return dotHTML(n)+esc(n); }

const FMT_HINTS = {
  rr:"Everyone plays everyone once. 4–20 teams works best — odd numbers get byes. You can add extra cycles and a playoff bracket later.",
  se:"Lose and you're out. Bracket is seeded in the order teams are added."
};

/* ---------- storage ---------- */
const store = {
  all(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }catch(e){ return {}; } },
  get(id){ return this.all()[id] || null; },
  save(t){ const a=this.all(); a[t.id]=t; localStorage.setItem(LS_KEY, JSON.stringify(a)); },
  remove(id){ const a=this.all(); delete a[id]; localStorage.setItem(LS_KEY, JSON.stringify(a)); }
};

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let toastTimer;
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2200);
}
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  $(id).classList.add("active");
  window.scrollTo(0,0);
}

/* =================================================================
   HOME
   ================================================================= */
function renderHome(){
  localStorage.removeItem(LS_ACTIVE);
  const list=$("saved-list");
  const items=Object.values(store.all()).sort((a,b)=>b.updatedAt-a.updatedAt);
  if(!items.length){ list.innerHTML='<div class="empty">No tournaments yet. Time to throw some balls.</div>'; return; }
  list.innerHTML=items.map(t=>{
    const total=countGames(t), done=countDone(t);
    const status=total>0&&done>=total?"Finished":`${done}/${total} games played`;
    const fmt=FMT_NAMES[t.format] + (t.playoffs?" + Playoffs":"");
    return `<button class="saved-item" onclick="openTournament('${t.id}')">
      <div class="grow">
        <div class="nm">${esc(t.name)}</div>
        <div class="meta">${fmt} · ${t.teams.length} teams · ${status}</div>
      </div>
      <span class="del" onclick="event.stopPropagation();deleteTournament('${t.id}')" role="button" aria-label="Delete">🗑</span>
    </button>`;
  }).join("");
}
function deleteTournament(id){
  const t=store.get(id);
  if(t && confirm(`Delete "${t.name}"? This can't be undone.`)){ store.remove(id); renderHome(); }
}

/* =================================================================
   SETUP
   ================================================================= */
let draftTeams=[], draftFmt="rr", coloursOpen=false;

function goSetup(){
  draftTeams=[]; draftFmt="rr"; coloursOpen=false;
  $("t-name").value=""; $("team-name").value="";
  $("colour-grid").style.display="none"; $("colour-arrow").textContent="▾";
  setFmt("rr"); renderDraftTeams();
  show("scr-setup");
}
function toggleColours(){
  coloursOpen=!coloursOpen;
  $("colour-grid").style.display=coloursOpen?"":"none";
  $("colour-arrow").textContent=coloursOpen?"▴":"▾";
}
function toggleColourTeam(c){
  const i=draftTeams.findIndex(t=>t.toLowerCase()===c.toLowerCase());
  if(i>=0){ draftTeams.splice(i,1); }
  else{
    if(draftTeams.length>=20){ toast("Maximum 20 teams"); return; }
    draftTeams.push(c);
  }
  renderDraftTeams();
}
function renderColourChips(){
  $("colour-grid").innerHTML=COLOUR_NAMES.map(c=>{
    const on=draftTeams.some(t=>t.toLowerCase()===c.toLowerCase());
    return `<button class="chip${on?" on":""}" onclick="toggleColourTeam('${c}')" aria-pressed="${on}">${dotHTML(c)}${c}<span class="ck">✓</span></button>`;
  }).join("");
}
function setFmt(f){
  draftFmt=f;
  document.querySelectorAll("#fmt-seg button").forEach(b=>b.classList.toggle("on",b.dataset.f===f));
  $("fmt-hint").textContent=FMT_HINTS[f];
}
function addTeam(){
  const inp=$("team-name"), name=inp.value.trim();
  if(!name) return;
  if(draftTeams.length>=20){ toast("Maximum 20 teams"); return; }
  if(draftTeams.some(t=>t.toLowerCase()===name.toLowerCase())){ toast("That team name is taken"); return; }
  draftTeams.push(name); inp.value=""; inp.focus(); renderDraftTeams();
}
function addRandomTeam(){
  if(draftTeams.length>=20){ toast("Maximum 20 teams"); return; }
  const avail=FUN_NAMES.filter(n=>!draftTeams.includes(n));
  if(!avail.length){ toast("Out of random names!"); return; }
  draftTeams.push(avail[Math.floor(Math.random()*avail.length)]);
  renderDraftTeams();
}
function removeTeam(i){ draftTeams.splice(i,1); renderDraftTeams(); }
function renderDraftTeams(){
  $("team-count").textContent=draftTeams.length;
  $("team-list").innerHTML=draftTeams.map((t,i)=>
    `<div class="team-row"><span class="num">${i+1}</span><span class="nm">${dotHTML(t)}${esc(t)}</span>
     <button class="rm" onclick="removeTeam(${i})" aria-label="Remove ${esc(t)}">✕</button></div>`).join("");
  renderColourChips();
}

function createTournament(){
  const name=$("t-name").value.trim() || "Dodgeball Tournament";
  const min = draftFmt==="rr" ? 3 : 2;
  if(draftTeams.length<min){ toast(`${FMT_NAMES[draftFmt]} needs at least ${min} teams`); return; }
  const teams=draftTeams.map(n=>({id:uid(), name:n}));
  const t={ id:uid(), name, format:draftFmt, teams, createdAt:Date.now(), updatedAt:Date.now() };

  if(draftFmt==="rr"){
    t.cycles=[ buildRoundRobin(teams.map(x=>x.id)) ]; // array of cycles, each = array of rounds
    t.playoffs=null;
  } else {
    t.bracket=buildBracket(teams.map(x=>x.id));
  }
  store.save(t);
  openTournament(t.id);
}

/* =================================================================
   SCHEDULING
   ================================================================= */
// Circle method: each team plays every other exactly once; null = bye.
function buildRoundRobin(ids){
  const arr=[...ids];
  if(arr.length%2) arr.push(null);
  const n=arr.length, half=n/2, rounds=[];
  for(let r=0;r<n-1;r++){
    const games=[], byes=[];
    for(let i=0;i<half;i++){
      const a=arr[i], b=arr[n-1-i];
      if(a!==null && b!==null){
        const [h,w] = r%2 ? [b,a] : [a,b]; // alternate sides for fairness
        games.push({id:uid(), a:h, b:w, sa:null, sb:null});
      } else {
        byes.push(a===null?b:a);
      }
    }
    rounds.push({games, byes});
    arr.splice(1,0,arr.pop()); // rotate, first team fixed
  }
  return rounds;
}

// Single elimination, byes pad to next power of two (top seeds get byes).
// ids must be in seed order: ids[0] = 1 seed.
function buildBracket(ids){
  let size=1; while(size<ids.length) size*=2;
  const seeds=seedOrder(size);
  const slots=new Array(size).fill(null);
  seeds.forEach((seed,pos)=>{ if(seed<=ids.length) slots[pos]=ids[seed-1]; });

  const rounds=[]; let games=size/2;
  for(let r=0;games>=1;r++,games/=2){
    rounds.push(Array.from({length:games},()=>({id:uid(), a:null, b:null, sa:null, sb:null, winner:null})));
  }
  for(let m=0;m<size/2;m++){
    rounds[0][m].a=slots[m*2];
    rounds[0][m].b=slots[m*2+1];
  }
  const br={rounds, seeds:ids.slice()}; // remember seeding for display
  rounds[0].forEach((g,m)=>{
    if(g.a&&!g.b) advanceWinner(br,0,m,g.a,true);
    else if(g.b&&!g.a) advanceWinner(br,0,m,g.b,true);
  });
  return br;
}
// Standard 1v(n), 2v(n-1)... seeding positions
function seedOrder(size){
  let order=[1];
  while(order.length<size){
    const next=[], len=order.length*2;
    order.forEach(s=>{ next.push(s, len+1-s); });
    order=next;
  }
  return order;
}
function advanceWinner(br,r,m,winnerId,isBye){
  const g=br.rounds[r][m];
  g.winner=winnerId;
  if(isBye) g.bye=true;
  if(r+1<br.rounds.length){
    const ng=br.rounds[r+1][Math.floor(m/2)];
    const slot = m%2===0 ? "a" : "b";
    if(ng[slot]!==winnerId){
      ng[slot]=winnerId;
      clearDownstream(br,r+1,Math.floor(m/2));
    }
  }
}
// when an earlier result changes, wipe affected later games
function clearDownstream(br,r,m){
  const g=br.rounds[r][m];
  const prevWinner=g.winner;
  g.sa=null; g.sb=null; g.winner=null;
  if(prevWinner && r+1<br.rounds.length){
    const ng=br.rounds[r+1][Math.floor(m/2)];
    const slot=m%2===0?"a":"b";
    if(ng[slot]===prevWinner){ ng[slot]=null; clearDownstream(br,r+1,Math.floor(m/2)); }
  }
}
// remove a match's winner from the bracket (score cleared)
function retractWinner(br,r,m){
  const g=br.rounds[r][m];
  if(!g.winner) return;
  const w=g.winner; g.winner=null;
  if(r+1<br.rounds.length){
    const ng=br.rounds[r+1][Math.floor(m/2)], slot=m%2===0?"a":"b";
    if(ng[slot]===w){ ng[slot]=null; clearDownstream(br,r+1,Math.floor(m/2)); }
  }
}
function findInBracket(br,gid){
  if(!br) return null;
  for(let r=0;r<br.rounds.length;r++)
    for(let m=0;m<br.rounds[r].length;m++)
      if(br.rounds[r][m].id===gid) return {r,m,g:br.rounds[r][m]};
  return null;
}

/* =================================================================
   GAME ACCESS / COUNTS
   ================================================================= */
function rrGames(t){ return t.cycles.flatMap(c=>c.flatMap(r=>r.games)); }
function bracketGames(br){ return br ? br.rounds.flat().filter(g=>!g.bye) : []; }
function allGames(t){
  if(t.format==="rr") return rrGames(t).concat(bracketGames(t.playoffs));
  return bracketGames(t.bracket);
}
const isDone = g => g.sa!==null && g.sb!==null;
function countGames(t){ return allGames(t).length; }
function countDone(t){ return allGames(t).filter(isDone).length; }
function findGame(t,gid){
  for(const g of allGames(t)) if(g.id===gid) return g;
  return null;
}
function teamName(t,id){
  const m=t.teams.find(x=>x.id===id);
  return m?m.name:"TBD";
}

/* =================================================================
   TOURNAMENT VIEW
   ================================================================= */
let cur=null, curTab="sched";

function openTournament(id){
  cur=store.get(id);
  if(!cur){ toast("Tournament not found"); renderHome(); return; }
  localStorage.setItem(LS_ACTIVE,id);
  $("tn-title").textContent=cur.name;
  $("tab-sched").textContent = cur.format==="se" ? "Bracket" : "Schedule";
  $("tab-stand").textContent = cur.format==="se" ? "Results" : "Standings";
  $("tab-po").style.display = cur.format==="rr" ? "" : "none";
  setTab("sched");
  show("scr-tourn");
}
function setTab(tab){
  curTab=tab;
  ["sched","stand","po"].forEach(k=>{
    $("tab-"+k).classList.toggle("on",tab===k);
    $("view-"+k).style.display = tab===k ? "" : "none";
  });
  renderTournament();
}
function renderTournament(){
  const total=countGames(cur), done=countDone(cur);
  $("tn-sub").textContent=`${FMT_NAMES[cur.format]} · ${done}/${total} played`;
  if(curTab==="sched"){
    $("view-sched").innerHTML = cur.format==="se" ? bracketHTML(cur,cur.bracket) : scheduleHTML(cur);
  } else if(curTab==="stand"){
    $("view-stand").innerHTML = cur.format==="se" ? elimResultsHTML(cur) : standingsHTML(cur);
  } else {
    $("view-po").innerHTML = playoffsHTML(cur);
  }
}

/* ---------- score entry ---------- */
function scoreSelect(g,side){
  const val=g["s"+side];
  let opts='<option value=""'+(val===null?" selected":"")+'>–</option>';
  for(let i=0;i<=MAX_SCORE;i++)
    opts+=`<option value="${i}"${val===i?" selected":""}>${i}</option>`;
  return `<select class="score-sel" aria-label="Score" onchange="setScore('${g.id}','${side}',this.value)">${opts}</select>`;
}
function gameHTML(t,g,seedOf){
  const done=isDone(g);
  const winA=done&&g.sa>g.sb, winB=done&&g.sb>g.sa;
  const sd=id=>seedOf?`<span class="seed">${seedOf(id)}</span>`:"";
  return `<div class="game${done?" done":""}">
    <div class="tick">✓</div>
    <div class="vsrow"><div class="tn${winA?" win":""}">${sd(g.a)}${teamLabel(t,g.a)}</div>${scoreSelect(g,"a")}</div>
    <div class="vsrow"><div class="tn${winB?" win":""}">${sd(g.b)}${teamLabel(t,g.b)}</div>${scoreSelect(g,"b")}</div>
  </div>`;
}

window.setScore=function(gid,side,val){
  const g=findGame(cur,gid);
  if(!g) return;
  const v = val===""?null:parseInt(val,10);
  const old={sa:g.sa,sb:g.sb};
  g["s"+side]=v;

  // one-team-scores shortcut: entering 1–9 auto-fills a blank opposing score with 0
  const other = side==="a" ? "b" : "a";
  if(v!==null && v>0 && g["s"+other]===null) g["s"+other]=0;

  // elimination rules apply to the main bracket AND the playoff bracket
  const br = cur.format==="se" ? cur.bracket : cur.playoffs;
  const pos = findInBracket(br,gid);
  if(pos){
    if(isDone(g)){
      if(g.sa===g.sb){
        g.sa=old.sa; g.sb=old.sb;
        toast("Elimination games need a winner — no ties");
        renderTournament();
        return;
      }
      advanceWinner(br,pos.r,pos.m,g.sa>g.sb?g.a:g.b,false);
    } else {
      retractWinner(br,pos.r,pos.m);
    }
  }
  cur.updatedAt=Date.now();
  store.save(cur);
  renderTournament();
};

/* ---------- schedule (round robin) ---------- */
function roundBlock(t,round,label){
  const games=round.games;
  const done=games.length>0 && games.every(isDone);
  const byes=(round.byes||[]).map(id=>`<div class="bye"><b>${teamLabel(t,id)}</b> has a bye this round</div>`).join("");
  return `<div class="round">
    <div class="round-h"><span class="rn">Round ${label}</span>
      <span class="badge${done?" done":""}">${done?"✓ Complete":games.filter(isDone).length+"/"+games.length}</span></div>
    ${games.map(g=>gameHTML(t,g)).join("")}${byes}
  </div>`;
}
function scheduleHTML(t){
  let roundNo=0, html="";
  t.cycles.forEach((cycle,ci)=>{
    if(t.cycles.length>1) html+=`<div class="cycle-h">Cycle ${ci+1}</div>`;
    cycle.forEach(round=>{ roundNo++; html+=roundBlock(t,round,roundNo); });
  });
  html+=`<button class="btn btn-ghost" onclick="addCycle()">+ Add another cycle</button>
    <p class="tiebreak-note">A cycle adds a full round robin — every team plays every other team once more. Standings carry across all cycles.</p>`;
  return html;
}
window.addCycle=function(){
  const roundsPer=cur.cycles[0].length;
  if(!confirm(`Add another full cycle? That's ${roundsPer} more round${roundsPer>1?"s":""} where everyone plays everyone again.`)) return;
  cur.cycles.push(buildRoundRobin(cur.teams.map(x=>x.id)));
  cur.updatedAt=Date.now();
  store.save(cur);
  renderTournament();
  toast(`Cycle ${cur.cycles.length} added`);
};

/* ---------- bracket rendering (shared by single elim + playoffs) ---------- */
function bracketHTML(t,br,seeded){
  const n=br.rounds.length;
  const names=r=>{
    const left=n-r;
    if(left===1) return "Final";
    if(left===2) return "Semifinals";
    if(left===3) return "Quarterfinals";
    return "Round "+(r+1);
  };
  const seedOf = seeded ? (id=>{
    const i=br.seeds.indexOf(id);
    return i<0?"":"#"+(i+1);
  }) : null;
  const sd=id=>seedOf?`<span class="seed">${seedOf(id)}</span>`:"";
  const cols=br.rounds.map((rd,r)=>`
    <div class="bcol">
      <div class="bcol-h">${names(r)}</div>
      ${rd.map(g=>{
        if(g.bye) return `<div class="bye"><b>${sd(g.winner)}${teamLabel(t,g.winner)}</b> — bye, advances</div>`;
        if(!(g.a&&g.b)) return `<div class="game">
          <div class="vsrow"><div class="tn ${g.a?"":"tbd"}">${g.a?sd(g.a)+teamLabel(t,g.a):"Winner TBD"}</div><div></div></div>
          <div class="vsrow"><div class="tn ${g.b?"":"tbd"}">${g.b?sd(g.b)+teamLabel(t,g.b):"Winner TBD"}</div><div></div></div>
        </div>`;
        return gameHTML(t,g,seedOf);
      }).join("")}
    </div>`).join("");
  const final=br.rounds[n-1][0];
  const champ=final.winner?`<div class="champ"><small>Champion</small>🏆 ${esc(teamName(t,final.winner))}</div>`:"";
  return `<div class="bracket-wrap"><div class="bracket">${cols}</div></div>${champ}
    <p class="tiebreak-note">Swipe sideways to see later rounds. Scores save automatically.</p>`;
}

/* ---------- playoffs (round robin only) ---------- */
function playoffsHTML(t){
  if(!t.playoffs){
    const unplayed=rrGames(t).filter(g=>!isDone(g)).length;
    return `<div class="playoff-intro">
      <h3>Playoff bracket</h3>
      <p>Builds a single elimination bracket seeded from the current standings — 1st seed plays the lowest seed, and byes go to the top seeds. All ${t.teams.length} teams advance.</p>
      ${unplayed?`<p style="margin-top:8px;color:var(--pink);font-weight:700">${unplayed} round robin game${unplayed>1?"s":""} still unplayed — seeding will use standings as they are now.</p>`:""}
    </div>
    <button class="btn btn-pink" onclick="buildPlayoffs()">Build playoff bracket</button>`;
  }
  return bracketHTML(t,t.playoffs,true)+
    `<p class="locknote">🔒 Seeding is locked from when the bracket was built — later round robin edits won't change it.</p>
     <button class="btn btn-ghost btn-sm" onclick="rebuildPlayoffs()">↻ Rebuild bracket (re-seed, wipes playoff scores)</button>`;
}
window.buildPlayoffs=function(){
  const unplayed=rrGames(cur).filter(g=>!isDone(g)).length;
  if(unplayed && !confirm(`${unplayed} round robin game${unplayed>1?"s are":" is"} still unplayed. Seed the bracket from current standings anyway?`)) return;
  const seeds=computeStandings(cur,cur.teams.map(x=>x.id),rrGames(cur)).map(s=>s.id);
  cur.playoffs=buildBracket(seeds);
  cur.updatedAt=Date.now();
  store.save(cur);
  renderTournament();
  toast("Playoff bracket built");
};
window.rebuildPlayoffs=function(){
  if(!confirm("Rebuild the bracket? This re-seeds from current standings and wipes all playoff scores.")) return;
  const seeds=computeStandings(cur,cur.teams.map(x=>x.id),rrGames(cur)).map(s=>s.id);
  cur.playoffs=buildBracket(seeds);
  cur.updatedAt=Date.now();
  store.save(cur);
  renderTournament();
  toast("Bracket rebuilt");
};

/* ---------- standings ---------- */
function computeStandings(t,teamIds,games){
  const s={};
  teamIds.forEach(id=>s[id]={id,w:0,l:0,pf:0,pa:0});
  games.filter(isDone).forEach(g=>{
    s[g.a].pf+=g.sa; s[g.a].pa+=g.sb;
    s[g.b].pf+=g.sb; s[g.b].pa+=g.sa;
    if(g.sa>g.sb){s[g.a].w++;s[g.b].l++;}
    else if(g.sb>g.sa){s[g.b].w++;s[g.a].l++;}
  });
 return Object.values(s).sort((x,y)=>
    y.pf-x.pf || x.pa-y.pa || y.w-x.w || teamName(t,x.id).localeCompare(teamName(t,y.id))
  );
}
let standDetails=false;
window.toggleStandDetails=function(){
  standDetails=!standDetails;
  renderTournament();
};
function standingsHTML(t){
  const rows=computeStandings(t,t.teams.map(x=>x.id),rrGames(t));
  return `<button class="btn btn-ghost btn-sm det-toggle" onclick="toggleStandDetails()">
      ${standDetails?"Hide details \u25be":"Show details \u25b8"}</button>
    <table class="standings${standDetails?" details":""}">
    <thead><tr><th>#</th><th class="tl">Team</th><th class="win-col">PF</th><th>W</th><th>L</th>
      <th class="det">PA</th><th class="det">+/\u2212</th></tr></thead>
    <tbody>${rows.map((r,i)=>`<tr${i===0&&(r.w||r.l)?' class="lead"':""}>
      <td class="pos">${i+1}</td><td class="tl">${teamLabel(t,r.id)}</td>
      <td class="win-col">${r.pf}</td><td>${r.w}</td><td>${r.l}</td>
      <td class="det">${r.pa}</td>
      <td class="det">${r.pf-r.pa>0?"+":""}${r.pf-r.pa}</td>
    </tr>`).join("")}</tbody></table>
    <p class="tiebreak-note">${standDetails
      ?"PF: Points For \u00b7 W: Wins \u00b7 L: Losses \u00b7 PA: Points Against \u00b7 +/\u2212: Point Difference"
      :"PF: Points For \u00b7 W: Wins \u00b7 L: Losses"}</p>
    <p class="tiebreak-note">Ranked by total points scored, then fewest points conceded, then wins. Round robin games only \u2014 playoff games don't count here.</p>`;
}
function elimResultsHTML(t){
  const games=bracketGames(t.bracket).filter(isDone);
  const final=t.bracket.rounds[t.bracket.rounds.length-1][0];
  const champ=final.winner?`<div class="champ"><small>Champion</small>🏆 ${esc(teamName(t,final.winner))}</div>`:'<div class="empty">No champion yet — finish the bracket!</div>';
  if(!games.length) return champ+'<p class="tiebreak-note">Completed games will appear here.</p>';
  return champ+`<div class="section-label">Completed games</div>`+
    games.map(g=>`<div class="game done"><div class="tick">✓</div>
      <div class="vsrow"><div class="tn${g.sa>g.sb?" win":""}">${teamLabel(t,g.a)}</div><div style="text-align:center;font-weight:900;font-size:20px">${g.sa}</div></div>
      <div class="vsrow"><div class="tn${g.sb>g.sa?" win":""}">${teamLabel(t,g.b)}</div><div style="text-align:center;font-weight:900;font-size:20px">${g.sb}</div></div>
    </div>`).join("");
}

/* =================================================================
   MIGRATION + BOOT
   ================================================================= */
// older saves: rr used t.rounds, pool play removed
(function migrate(){
  const all=store.all(); let changed=false;
  Object.values(all).forEach(t=>{
    if(t.format==="rr" && t.rounds && !t.cycles){ t.cycles=[t.rounds]; delete t.rounds; t.playoffs=t.playoffs||null; changed=true; }
    if(t.format==="rr" && !("playoffs" in t)){ t.playoffs=null; changed=true; }
    if(t.format==="pp"){ delete all[t.id]; changed=true; } // pool play retired
  });
  if(changed) localStorage.setItem(LS_KEY, JSON.stringify(all));
})();

(function init(){
  const active=localStorage.getItem(LS_ACTIVE);
  if(active && store.get(active)) openTournament(active);
  else renderHome();
})();

// Service worker — full offline support (skipped on file:// where SWs aren't allowed)
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
</body>
